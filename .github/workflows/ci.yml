name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build src/OficinaDigital/OficinaDigital.csproj --configuration Release
      - run: dotnet run --project tests/OficinaDigital.Tests/OficinaDigital.Tests.csproj --configuration Release
